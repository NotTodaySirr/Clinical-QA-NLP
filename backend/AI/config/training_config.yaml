# training_config.yaml
# Clinical QA PubMedBERT Fine-Tuning Configuration
# Edit this file to change training behaviour.
# run.py loads this config automatically at startup.

# Model
model:
  name: "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext" # HuggingFace model identifier
  #name: "dmis-lab/biobert-v1.1"
  num_labels: 3 # Yes=1 / No=0 / Maybe=2
  max_len: 512 # Max sequence length cap: 512

# Training Hyperparameters
training:
  epochs: 5
  batch_size: 16
  learning_rate: 3.0e-5
  weight_decay: 0.01 # AdamW L2 regularization
  warmup_ratio: 0.06 # Fraction of steps used for LR warm-up
  lr_scheduler: "cosine" # "cosine" | "linear"
  max_grad_norm: 1.0 # Gradient clipping threshold

# Data
data:
  labeled_csv: "data/labeled/pubmedqa_labeled.csv"
  test_size: 0.2 # Fraction of data held out for val+test
  random_state: 42

#  Output
output:
  save_dir: "saved_model/pubmedbert_finetuned" # Relative to backend/AI/
  #save_dir: "saved_model/biobert_finetuned"
